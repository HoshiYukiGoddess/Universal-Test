[General]
; PoC default: let the player test the universal bypass against any target.
; Set this to 0 once a dedicated challenger NPC is configured below.
bPlayerHasAbsoluteDamage=1

; Optional: grant the same universal damage property to any actor whose BASE NPC form
; resolves from this plugin + local form ID.  No target/opponent information is used.
sAttackerPlugin=
iAttackerLocalFormID=0x0

; When an absolute hit causes death, reject standard Resurrect / positive Health writes
; for this many seconds.  This is a universal postcondition, not target-specific logic.
bTerminalDeath=1
fTerminalHoldSeconds=10.0
