name: Build UniversalCombatArbiter DLL

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  COMMONLIB_TAG: v8.1.0
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\vcpkg-cache,readwrite"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ env.COMMONLIB_TAG }}-v1
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.COMMONLIB_TAG }}-

      - name: Download CommonLibSSE-NG
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force extern | Out-Null

          if (Test-Path "extern/CommonLibSSE-NG") {
            Remove-Item "extern/CommonLibSSE-NG" -Recurse -Force
          }

          git clone --depth 1 `
            --branch $env:COMMONLIB_TAG `
            --recurse-submodules `
            https://github.com/alandtse/CommonLibSSE-NG.git `
            extern/CommonLibSSE-NG

      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
          & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics

            - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_MANIFEST_DIR="${{ github.workspace }}/extern/CommonLibSSE-NG" `
            -DBUILD_TESTS=OFF `
            -DENABLE_SKYRIM_SE=ON `
            -DENABLE_SKYRIM_AE=ON `
            -DENABLE_SKYRIM_VR=ON `
            -DCOMMONLIB_PREBUILT_MULTICONFIG=ON `
            -DCOMMONLIB_ENABLE_IPO=OFF

      - name: Build Release DLL
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --target UniversalCombatArbiter `
            --parallel 2

      - name: Make installable layout
        shell: pwsh
        run: |
          $out = "artifact/Data/SKSE/Plugins"
          New-Item -ItemType Directory -Force $out | Out-Null

          $dll = Get-ChildItem build -Recurse `
            -Filter UniversalCombatArbiter.dll |
            Select-Object -First 1

          if (-not $dll) {
            throw "UniversalCombatArbiter.dll was not produced."
          }

          Copy-Item $dll.FullName `
            "$out/UniversalCombatArbiter.dll"

          $fmt = Get-ChildItem build -Recurse -Filter fmt.dll | Select-Object -First 1
          if ($fmt) {
            Copy-Item $fmt.FullName "$out/fmt.dll"
          }

          $spdlog = Get-ChildItem build -Recurse -Filter spdlog.dll | Select-Object -First 1
          if ($spdlog) {
            Copy-Item $spdlog.FullName "$out/spdlog.dll"
          }

          Copy-Item `
            "config/UniversalCombatArbiter.ini" `
            "$out/UniversalCombatArbiter.ini"

          $pdb = Get-ChildItem build -Recurse `
            -Filter UniversalCombatArbiter.pdb |
            Select-Object -First 1

          if ($pdb) {
            Copy-Item $pdb.FullName `
              "$out/UniversalCombatArbiter.pdb"
          }

      - name: Upload compiled plugin
        uses: actions/upload-artifact@v4
        with:
          name: UniversalCombatArbiter-1.6.1170-PoC
          path: artifact/**
          if-no-files-found: error
